name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Build artifact and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble release zip from tracked files
        run: git ls-files -z | grep -vz '^server/data/' | xargs -0 zip -q "$RUNNER_TEMP/waitshare.zip"
      - name: Create GitHub Release with the artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git for-each-ref refs/tags --sort=-creatordate --format='%(refname:short)' | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$PREV" ]; then RANGE="$PREV..${GITHUB_REF_NAME}"; else RANGE=""; fi
          COMMITS=$(git log --oneline --no-merges "$RANGE" 2>/dev/null | head -40 || true)
          NOTES=$(printf 'WaitShare %s\n\n%s\n\nSource snapshot built and published automatically by the release workflow.' "$GITHUB_REF_NAME" "$COMMITS")
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/waitshare.zip" --title "$GITHUB_REF_NAME" --notes "$NOTES"
      - name: Push release branch and PR to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="release/${GITHUB_REF_NAME}"
          git checkout -b "$BR"
          cp "$RUNNER_TEMP/waitshare.zip" waitshare.zip
          git add -f waitshare.zip
          git -c user.name="waitshare-ops" -c user.email="waitshare-ops@users.noreply.github.com" \
            commit -m "chore(release): ship ${GITHUB_REF_NAME} release artifact"
          git push -u origin "$BR"
          PR_URL=$(gh pr create --base main --head "$BR" \
            --title "chore(release): ship ${GITHUB_REF_NAME} artifact" \
            --body "Automated artifact snapshot generated by the release workflow." 2>&1) || \
            { echo "::error::pr create failed: $PR_URL"; PR_URL=""; }
          if [ -n "$PR_URL" ]; then
            gh pr merge "$PR_URL" --merge --repo "$GITHUB_REPOSITORY" || \
              echo "::error::pr merge failed (branch protection may require manual merge)"
          fi
