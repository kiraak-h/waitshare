name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (typecheck, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w server
      - run: npm run build -w server
      - run: npm test -w server

  server-postgres:
    name: server (test against Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: waitshare
          POSTGRES_PASSWORD: waitshare_dev
          POSTGRES_DB: waitshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waitshare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w server
      - run: DATABASE_URL=postgres://waitshare:waitshare_dev@localhost:5432/waitshare npm test -w server

  web:
    name: web (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w web
      - run: npm run build -w web
